<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Lennon Intro</title>
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Fraunces";
        src: url("assets/fraunces-latin-full-normal.woff2") format("woff2");
        font-weight: 100 900;
        font-style: normal;
      }
      @font-face {
        font-family: "Fraunces";
        src: url("assets/fraunces-latin-full-italic.woff2") format("woff2");
        font-weight: 100 900;
        font-style: italic;
      }
      @font-face {
        font-family: "Caveat";
        src: url("assets/caveat-latin-700-normal.woff2") format("woff2");
        font-weight: 700;
        font-style: normal;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #1a100a;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1a100a;
        color: #f4e6cc;
        font-family: "Fraunces", serif;
      }
      .clip {
        position: absolute;
        inset: 0;
      }
      .center {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .hand {
        font-family: "Caveat", cursive;
        font-weight: 700;
        color: #ffb35c;
      }

      /* ---------- the room (shared background) ---------- */
      #wall {
        position: absolute;
        inset: 0 0 210px 0;
        background: linear-gradient(180deg, #2b1a10 0%, #3a2315 70%, #43291a 100%);
      }
      #lamp-glow {
        position: absolute;
        left: 100px;
        top: -260px;
        width: 1500px;
        height: 1300px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 170, 80, 0.55) 0%, rgba(255, 130, 50, 0.22) 38%, rgba(255, 120, 40, 0) 68%);
      }
      #glow-2 {
        position: absolute;
        right: -200px;
        top: 260px;
        width: 900px;
        height: 900px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 150, 70, 0.25), rgba(255, 150, 70, 0) 65%);
      }
      #floor {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 210px;
        background:
          repeating-linear-gradient(90deg, rgba(0, 0, 0, 0.22) 0 3px, transparent 3px 240px),
          linear-gradient(180deg, #8a4b22 0%, #6b3818 60%, #4e2810 100%);
      }
      #baseboard {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 204px;
        height: 14px;
        background: #24150c;
      }
      #lamp {
        position: absolute;
        left: 150px;
        top: 70px;
        width: 220px;
        height: 130px;
      }
      #lamp-shade {
        position: absolute;
        left: 0;
        top: 0;
        width: 220px;
        height: 120px;
        border-radius: 110px 110px 12px 12px;
        background: linear-gradient(180deg, #e9c27a, #b8742f);
      }
      #lamp-bulb {
        position: absolute;
        left: 70px;
        top: 100px;
        width: 80px;
        height: 40px;
        border-radius: 0 0 40px 40px;
        background: #fff2c8;
      }
      .plant {
        position: absolute;
        bottom: 150px;
        width: 260px;
        height: 420px;
        transform-origin: 50% 100%;
      }
      #plant-l {
        left: -30px;
      }
      #plant-r {
        right: -10px;
      }
      #grain {
        position: absolute;
        inset: 0;
        opacity: 0.12;
        mix-blend-mode: overlay;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' seed='4'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>");
      }

      /* ---------- scene 1: lamp on, name ---------- */
      #s1-hey {
        font-size: 96px;
        margin-bottom: -10px;
      }
      #s1-name {
        display: flex;
        font-size: 300px;
        font-style: italic;
        font-weight: 600;
        letter-spacing: -0.02em;
        line-height: 1;
      }
      .s1-letter {
        display: block;
      }
      #s1-under {
        width: 760px;
        height: 14px;
        margin-top: 20px;
        border-radius: 7px;
        background: #d9622b;
        transform-origin: left center;
      }

      /* ---------- scene 2: gallery wall ---------- */
      #s2-label {
        position: absolute;
        left: 0;
        right: 0;
        top: 80px;
        text-align: center;
        font-size: 80px;
      }
      #s2-wall {
        position: absolute;
        left: 0;
        right: 0;
        top: 230px;
        display: flex;
        justify-content: center;
        gap: 90px;
      }
      .frame {
        position: relative;
        width: 380px;
        height: 520px;
        padding: 22px;
        background: #1c120c;
        border-radius: 4px;
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.45);
        transform-origin: 50% -60px;
      }
      .frame.wood {
        background: linear-gradient(135deg, #a8672e, #6d3d18);
      }
      .poster {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 30px 26px;
        border: 6px solid #f4e6cc;
      }
      .poster .small {
        font-family: "Caveat", cursive;
        font-weight: 700;
        font-size: 42px;
      }
      .poster .big {
        font-size: 64px;
        font-weight: 800;
        line-height: 0.95;
        letter-spacing: -0.02em;
      }
      .poster .shape {
        width: 150px;
        height: 150px;
        border-radius: 50%;
        align-self: center;
      }
      #p1 {
        background: #d9622b;
        color: #1c120c;
      }
      #p1 .shape {
        background: #f4e6cc;
      }
      #p2 {
        background: #4f5a2a;
        color: #f4e6cc;
      }
      #p2 .shape {
        background: #e9b44c;
        border-radius: 12px;
      }
      #p3 {
        background: #efe2c8;
        color: #1c120c;
      }
      #p3 .shape {
        background: #2f4f6f;
      }

      /* ---------- scene 3: vinyl ---------- */
      #s3-stage {
        position: absolute;
        left: 0;
        right: 0;
        top: 220px;
        height: 600px;
      }
      #sleeve {
        position: absolute;
        left: 420px;
        top: 0;
        width: 600px;
        height: 600px;
        padding: 40px;
        background: #e9b44c;
        color: #1c120c;
        box-shadow: 0 30px 70px rgba(0, 0, 0, 0.5);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      #sleeve .t1 {
        font-size: 110px;
        font-weight: 800;
        font-style: italic;
        line-height: 0.9;
        letter-spacing: -0.02em;
      }
      #sleeve .t2 {
        font-family: "Caveat", cursive;
        font-weight: 700;
        font-size: 52px;
      }
      #record-wrap {
        position: absolute;
        left: 1000px;
        top: 20px;
        width: 560px;
        height: 560px;
      }
      #record {
        width: 560px;
        height: 560px;
        border-radius: 50%;
        background:
          repeating-radial-gradient(circle, #141414 0 3px, #1e1e1e 3px 6px),
          #151515;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 30px 70px rgba(0, 0, 0, 0.55);
      }
      #record-label {
        width: 210px;
        height: 210px;
        border-radius: 50%;
        background: #efe2c8;
        color: #1c120c;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 32px;
        font-weight: 800;
        font-style: italic;
        border: 18px solid #d9622b;
      }
      #s3-caption {
        position: absolute;
        left: 0;
        right: 0;
        top: 60px;
        text-align: center;
        font-size: 84px;
        line-height: 1;
      }

      /* ---------- scene 4: rug + outro ---------- */
      #rug-persp {
        position: absolute;
        left: 260px;
        right: 260px;
        bottom: -120px;
        height: 420px;
        perspective: 900px;
      }
      #rug {
        width: 100%;
        height: 100%;
        border: 16px solid #efe2c8;
        border-radius: 18px;
        background: repeating-conic-gradient(#1c120c 0 25%, #efe2c8 0 50%) 0 0 / 100px 100px;
      }
      #s4-text {
        position: absolute;
        left: 0;
        right: 0;
        top: 150px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      #s4-name {
        font-size: 230px;
        font-style: italic;
        font-weight: 600;
        line-height: 1;
        letter-spacing: -0.02em;
      }
      #s4-dot {
        color: #d9622b;
      }
      #s4-tag {
        margin-top: 10px;
        font-size: 84px;
      }
      #s4-cta {
        margin-top: 36px;
        padding: 18px 46px;
        border-radius: 999px;
        background: #f4e6cc;
        color: #1c120c;
        font-size: 36px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="12"
      data-width="1920"
      data-height="1080"
    >
      <div id="room" class="clip" data-start="0" data-duration="12" data-track-index="0">
        <div id="wall"></div>
        <div id="glow-2"></div>
        <div id="lamp-glow"></div>
        <div id="lamp">
          <div id="lamp-bulb"></div>
          <div id="lamp-shade"></div>
        </div>
        <div id="baseboard"></div>
        <div id="floor"></div>
        <svg id="plant-l" class="plant" viewBox="0 0 260 420" aria-hidden="true">
          <path d="M130 420 C120 300 60 260 10 230 C70 230 120 270 132 330 Z" fill="#3f4f22" />
          <path d="M130 420 C140 280 200 210 255 190 C210 240 160 300 138 360 Z" fill="#56692c" />
          <path d="M130 420 C110 260 120 120 150 20 C160 140 150 280 140 400 Z" fill="#4a5c26" />
          <path d="M130 420 C90 330 40 330 0 330 C50 350 100 370 126 410 Z" fill="#33421b" />
          <rect x="70" y="370" width="120" height="50" rx="10" fill="#b8742f" />
        </svg>
        <svg id="plant-r" class="plant" viewBox="0 0 260 420" aria-hidden="true">
          <path d="M130 420 C140 300 200 250 250 220 C190 230 140 270 128 330 Z" fill="#3f4f22" />
          <path d="M130 420 C120 270 60 200 8 180 C50 230 100 300 122 360 Z" fill="#56692c" />
          <path d="M130 420 C150 250 140 110 110 30 C100 150 110 280 120 400 Z" fill="#4a5c26" />
          <rect x="70" y="370" width="120" height="50" rx="10" fill="#d9622b" />
        </svg>
        <div id="grain"></div>
      </div>

      <section id="s1" class="clip center" data-start="0" data-duration="3.4" data-track-index="1">
        <div id="s1-hey" class="hand">hey, i'm</div>
        <div id="s1-name">
          <span class="s1-letter">L</span>
          <span class="s1-letter">e</span>
          <span class="s1-letter">n</span>
          <span class="s1-letter">n</span>
          <span class="s1-letter">o</span>
          <span class="s1-letter">n</span>
        </div>
        <div id="s1-under"></div>
      </section>

      <section id="s2" class="clip" data-start="3.4" data-duration="3.6" data-track-index="1">
        <div id="s2-label" class="hand">on my wall:</div>
        <div id="s2-wall">
          <div id="f1" class="frame">
            <div id="p1" class="poster">
              <div class="small">no. 01</div>
              <div class="shape"></div>
              <div class="big">Creator</div>
            </div>
          </div>
          <div id="f2" class="frame wood">
            <div id="p2" class="poster">
              <div class="small">no. 02</div>
              <div class="shape"></div>
              <div class="big">Builder</div>
            </div>
          </div>
          <div id="f3" class="frame">
            <div id="p3" class="poster">
              <div class="small">no. 03</div>
              <div class="shape"></div>
              <div class="big">Dreamer</div>
            </div>
          </div>
        </div>
      </section>

      <section id="s3" class="clip" data-start="7" data-duration="2.6" data-track-index="1">
        <div id="s3-stage">
          <div id="record-wrap" data-layout-allow-occlusion>
            <div id="record"><div id="record-label">@lenodrips</div></div>
          </div>
          <div id="sleeve">
            <div class="t2">side A</div>
            <div class="t1">Always Dripping</div>
          </div>
        </div>
        <div id="s3-caption" class="hand">now spinning</div>
      </section>

      <section id="s4" class="clip" data-start="9.6" data-duration="2.4" data-track-index="1">
        <div id="rug-persp" data-layout-allow-overflow><div id="rug"></div></div>
        <div id="s4-text">
          <div id="s4-name">Lennon<span id="s4-dot">.</span></div>
          <div id="s4-tag" class="hand">make yourself at home</div>
          <div id="s4-cta">come on in ↓</div>
        </div>
      </section>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });

      // the room: lamp clicks on with a little flicker, plants sway the whole time
      tl.fromTo("#lamp-glow", { opacity: 0 }, { opacity: 0.5, duration: 0.08 }, 0.3);
      tl.to("#lamp-glow", { opacity: 0.1, duration: 0.08 }, 0.42);
      tl.to("#lamp-glow", { opacity: 1, duration: 0.5, ease: "power2.out" }, 0.55);
      tl.fromTo("#lamp-bulb", { opacity: 0.2 }, { opacity: 1, duration: 0.1 }, 0.3);
      tl.fromTo("#glow-2", { opacity: 0 }, { opacity: 1, duration: 1.2, ease: "power2.out" }, 0.6);
      tl.fromTo("#lamp-glow", { scale: 1 }, { scale: 1.08, duration: 2, ease: "sine.inOut", yoyo: true, repeat: 4, immediateRender: false }, 1.05);
      tl.fromTo("#plant-l", { rotate: -2 }, { rotate: 2, duration: 2, ease: "sine.inOut", yoyo: true, repeat: 5 }, 0);
      tl.fromTo("#plant-r", { rotate: 2 }, { rotate: -2, duration: 2.4, ease: "sine.inOut", yoyo: true, repeat: 4 }, 0);

      // scene 1
      tl.fromTo("#s1-hey", { opacity: 0, y: 30, rotate: -4 }, { opacity: 1, y: 0, rotate: -4, duration: 0.6, ease: "power3.out" }, 0.7);
      tl.fromTo(
        ".s1-letter",
        { opacity: 0, yPercent: 40 },
        { opacity: 1, yPercent: 0, duration: 0.7, ease: "power3.out", stagger: 0.07 },
        0.9
      );
      tl.fromTo("#s1-under", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power3.inOut" }, 1.6);
      tl.to(["#s1-hey", "#s1-name", "#s1-under"], { opacity: 0, y: -40, duration: 0.4, ease: "power2.in", stagger: 0.04 }, 3.0);

      // scene 2: frames drop onto the wall and swing to rest
      tl.fromTo("#s2-label", { opacity: 0, y: 20, rotate: -3 }, { opacity: 1, y: 0, rotate: -3, duration: 0.5, ease: "power3.out" }, 3.45);
      ["#f1", "#f2", "#f3"].forEach((f, i) => {
        const t = 3.55 + i * 0.25;
        const rest = [-2, 1.5, -1][i];
        tl.fromTo(f, { y: -900 }, { y: 0, duration: 0.6, ease: "power3.out" }, t);
        tl.fromTo(f, { rotate: 12 * (i % 2 ? -1 : 1) }, { rotate: rest, duration: 1.4, ease: "elastic.out(1, 0.35)" }, t + 0.35);
      });
      tl.to(["#s2-label", "#s2-wall"], { opacity: 0, duration: 0.35, ease: "power2.in" }, 6.6);

      // scene 3: record slides out of the sleeve and spins
      tl.fromTo("#sleeve", { x: -300, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 7.05);
      tl.fromTo("#record-wrap", { x: -580 }, { x: 0, duration: 0.7, ease: "power3.inOut" }, 7.4);
      tl.fromTo("#record", { rotate: 0 }, { rotate: 540, duration: 2.2, ease: "none" }, 7.4);
      tl.fromTo("#s3-caption", { opacity: 0, y: 20, rotate: -3 }, { opacity: 1, y: 0, rotate: -3, duration: 0.5, ease: "power3.out" }, 8.0);
      tl.to(["#s3-stage", "#s3-caption"], { opacity: 0, duration: 0.3, ease: "power2.in" }, 9.3);

      // scene 4: rug rolls out, name, invite
      tl.fromTo("#rug", { y: 300, rotateX: 62 }, { y: 0, rotateX: 62, duration: 0.8, ease: "power3.out" }, 9.6);
      tl.fromTo("#s4-name", { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 9.75);
      tl.fromTo("#s4-tag", { opacity: 0, rotate: -3, y: 20 }, { opacity: 1, rotate: -3, y: 0, duration: 0.5, ease: "power3.out" }, 10.15);
      tl.fromTo("#s4-cta", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2)" }, 10.5);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
