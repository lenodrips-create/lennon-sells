<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Lennon Helman — Intro</title>
<script src="vendor/gsap.min.js"></script>
<style>
@font-face{font-family:"League Spartan";font-style:normal;font-weight:500;src:url("fonts/league-spartan-latin-500-normal.woff2") format("woff2")}
@font-face{font-family:"League Spartan";font-style:normal;font-weight:700;src:url("fonts/league-spartan-latin-700-normal.woff2") format("woff2")}
html,body{height:100%}
body{margin:0;background:#fff;color:#000}
#root{position:relative;width:100%;height:100%;overflow:hidden;background:#fff}
#stars{position:absolute;inset:0}
.star{position:absolute;border-radius:50%;background:#bdbdbd}
#glow{position:absolute;left:50%;top:50%;width:1400px;height:900px;margin:-450px 0 0 -700px;
  background:radial-gradient(closest-side, rgba(0,0,0,.06), rgba(0,0,0,.02) 55%, rgba(0,0,0,0) 100%)}
#stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;perspective:900px}
#name{margin:0;font-family:"League Spartan",sans-serif;font-weight:700;font-size:200px;line-height:1;
  letter-spacing:.02em;white-space:nowrap;padding:0 0 12px}
.ch,.tch{display:inline-block;transform-origin:50% 100%}
.gap{display:inline-block;width:.28em}
#rule{position:relative;width:1180px;height:3px;margin:40px 0 40px}
#line{position:absolute;inset:0;border-radius:2px;background:linear-gradient(90deg, rgba(0,0,0,0), #000 50%, rgba(0,0,0,0))}
#spark{position:absolute;top:-7px;left:0;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:#000;
  box-shadow:0 0 14px 4px rgba(0,0,0,.25)}
#town{margin:0;font-family:"League Spartan",sans-serif;font-weight:500;font-size:92px;line-height:1.1;
  letter-spacing:.04em;white-space:nowrap}
</style>
</head>
<body>
<div id="root" data-composition-id="intro" data-start="0" data-width="1920" data-height="1080" data-duration="8">
    <div id="stars"></div>
    <div id="glow"></div>
    <div id="stage">
      <h1 id="name"><span class="ch">L</span><span class="ch">e</span><span class="ch">n</span><span class="ch">n</span><span class="ch">o</span><span class="ch">n</span><span class="gap"></span><span class="ch">H</span><span class="ch">e</span><span class="ch">l</span><span class="ch">m</span><span class="ch">a</span><span class="ch">n</span></h1>
      <div id="rule"><div id="line"></div><div id="spark"></div></div>
      <p id="town"><span class="tch">G</span><span class="tch">r</span><span class="tch">e</span><span class="tch">e</span><span class="tch">n</span><span class="tch">c</span><span class="tch">a</span><span class="tch">s</span><span class="tch">t</span><span class="tch">l</span><span class="tch">e</span><span class="tch">,</span><span class="tch">&nbsp;</span><span class="tch">P</span><span class="tch">A</span></p>
    </div>
</div>
<script>
  // seeded star field, so every play and every render is the same frame for frame
  let seed = 7;
  const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const field = document.getElementById("stars");
  for (let i = 0; i < 140; i++) {
    const s = document.createElement("div");
    const r = 1 + rand() * 2.2;
    s.className = "star";
    s.style.cssText = `left:${rand() * 1920}px;top:${rand() * 1080}px;width:${r}px;height:${r}px;opacity:0`;
    field.appendChild(s);
  }

  const tl = gsap.timeline({ paused: true });

  // stars and glow come up out of the black
  tl.to(".star", { opacity: () => 0.25 + rand() * 0.6, duration: 1.4, stagger: { each: 0.008, from: "random" }, ease: "power1.out" }, 0);
  tl.to(".star", { opacity: 0.12, duration: 0.9, stagger: { each: 0.01, from: "random", yoyo: true, repeat: 3 }, ease: "sine.inOut" }, 1.6);
  tl.fromTo("#glow", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 2.2, ease: "power2.out" }, 0);
  tl.to("#glow", { scale: 1.12, duration: 2.6, yoyo: true, repeat: 1, ease: "sine.inOut" }, 2.2);

  // Lennon Helman: letters flip up from below and the spacing pulls together
  tl.fromTo(".ch",
    { yPercent: 115, rotationX: -85, opacity: 0, filter: "blur(14px)", x: (i, el, all) => (i - (all.length - 1) / 2) * 46 },
    { yPercent: 0, rotationX: 0, x: 0, opacity: 1, filter: "blur(0px)", duration: 1.1, ease: "expo.out", stagger: { each: 0.055, from: "center" } }, 0.25);
  tl.fromTo("#name", { textShadow: "0 0 0px rgba(0,0,0,0)" }, { textShadow: "0 8px 30px rgba(0,0,0,.22)", duration: 0.5, yoyo: true, repeat: 1, ease: "sine.inOut" }, 1.5);

  // a light line draws across with a spark riding it
  tl.fromTo("#line", { scaleX: 0 }, { scaleX: 1, duration: 1, ease: "power3.inOut" }, 2.0);
  tl.fromTo("#spark", { x: 0, opacity: 0 }, { x: 1180, opacity: 1, duration: 1, ease: "power3.inOut" }, 2.0);
  tl.to("#spark", { opacity: 0, scale: 2.5, duration: 0.4, ease: "power2.out" }, 3.0);

  // Greencastle, PA: letters drift in from blur and settle
  tl.fromTo(".tch",
    { opacity: 0, y: 30, filter: "blur(10px)", x: (i, el, all) => (i - (all.length - 1) / 2) * 34 },
    { opacity: 1, y: 0, x: 0, filter: "blur(0px)", duration: 0.9, ease: "power3.out", stagger: 0.045 }, 2.6);


  // the HyperFrames CLI pre-creates the registry; a plain browser load through the player does not
  tl.set({}, {}, 8); // hold the last frame to the 8s mark

  window.__timelines = window.__timelines || {};
  window.__timelines["intro"] = tl;
</script>
</body>
</html>
