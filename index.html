<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>Lennon Helman</title>
<meta name="description" content="Lennon Helman, software developer in Greencastle, PA: project gallery and services.">
<link rel="preload" href="reel/fonts/league-spartan-latin-900-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="modulepreload" href="mac/mac.min.js?v=12">
<style>
@font-face{font-family:"League Spartan";font-style:normal;font-weight:700;font-display:swap;src:url("reel/fonts/league-spartan-latin-700-normal.woff2") format("woff2")}
@font-face{font-family:"League Spartan";font-style:normal;font-weight:900;font-display:swap;src:url("reel/fonts/league-spartan-latin-900-normal.woff2") format("woff2")}
html{--gap:clamp(10px,2.6vw,40px);background:#0a0a0a;overscroll-behavior-y:none}
body{margin:0;background:#0a0a0a;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* The page opens in the sky: LENNON HELMAN over clouds. Scrolling flies the camera through the O, through the
   clouds and down onto the laptop lying on a lawn (the 3D MacBook, pinned to the screen). There, scrolling on
   flies the camera across the lawn to the house next door and in through its balcony door to the office, where it
   stops square on to a whiteboard with the services; one more scroll walks on through a doorway into the kitchen,
   to a chalk menu board with what Lennon does and his prices; and one more flies back out over the balcony, down to
   the front door and into the living room, to the reviews on the wall over the sofa. */

/* ---------- the sky at the top: layers over the 3D lawn, moved and faded by the scroll ---------- */
#intro{position:fixed;inset:0;z-index:3;overflow:hidden;pointer-events:none;contain:strict}
#intro > *{position:absolute;inset:0;width:100%;height:100%;will-change:transform,opacity}
.sky{background:linear-gradient(180deg,#2c78d0 0%,#5ea6e6 38%,#a7d1f4 72%,#dcedfb 100%)}
/* the clouds hang past both sides of the screen, so their drift never shows an edge */
#intro > .clouds{left:-20%;width:140%}
.fog{background:radial-gradient(120% 120% at 50% 50%,#fff 30%,#eef5fc 70%,#dbe9f7);opacity:0}
/* the fly-through: this much scrolling takes the camera from the sky down to the laptop */
.fly{height:260vh}
/* and this much from the laptop to the whiteboard in the office, then on to the kitchen */
.zoom{height:240vh}
.walk{height:160vh}
.tour{height:220vh}

/* the page: the MacBook on the lawn, then the services on its screen */
#work{--tb:clamp(84px,14vh,160px);position:relative;z-index:1;background:#3d6a22}   /* grass green until the 3D lawn draws */
/* the stage holds the headline and the MacBook, and stays pinned to the screen from the moment it reaches the top */
.stage{position:sticky;top:0;height:100vh;z-index:1}
.work-title{position:absolute;left:0;right:0;top:calc(var(--tb) * .2 + 70px);margin:0;text-align:center;font-family:"League Spartan",system-ui,sans-serif;font-weight:900;font-size:min(8vw,calc(var(--tb) * .72));line-height:.84;letter-spacing:-.04em;text-transform:uppercase;color:#fff;text-shadow:0 2px 30px rgba(0,0,0,.35),0 1px 3px rgba(0,0,0,.25);z-index:2;will-change:transform,opacity}
@media (max-width:700px){.work-title{top:clamp(76px,10vh,104px);font-size:15vw;padding:0 4vw}}
/* the MacBook is a real-time 3D model (mac/src/mac.js) */
#mac{position:absolute;inset:0;width:100%;height:100%;display:block}
body.no-mac .mac-hint{display:none}
.board-cta{position:absolute;left:50%;bottom:max(22px,calc(env(safe-area-inset-bottom) + 14px));transform:translateX(-50%);z-index:2;
  padding:11px 20px;border-radius:999px;background:rgba(17,17,19,.86);color:#fff;text-decoration:none;font:500 14px/1 "Readex Pro",system-ui,sans-serif;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 6px 24px rgba(0,0,0,.18);opacity:0;pointer-events:none;transition:opacity .4s}
/* it shows once the services have been written on the board */
.board-cta.on{opacity:1;pointer-events:auto;transition-delay:4.2s}
.board-cta:hover,.board-cta:focus-visible{background:#000}
.mac-hint{position:absolute;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));margin:0;text-align:center;font:600 12px/1 system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.5);opacity:0;transition:opacity .4s;z-index:2}


/* ---------- navigation: a pill of buttons in the top middle ---------- */
@font-face{font-family:"Readex Pro";font-style:normal;font-weight:400;font-display:swap;src:url("fonts/readex-pro-latin-400-normal.woff2") format("woff2")}
.topnav{position:fixed;top:max(24px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:4px;padding:8px 12px;border-radius:999px;
  background:rgba(23,23,23,.9);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);font:400 14px/1.25 "Readex Pro",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
.topnav a{padding:8px 20px;border-radius:999px;color:#d4d4d4;text-decoration:none;white-space:nowrap;transition:color .15s}
.topnav a:hover,.topnav a:focus-visible,.topnav a[aria-current="true"]{color:#fff}
.topnav a:focus-visible{outline:1px solid rgba(255,255,255,.5);outline-offset:-1px}
@media (max-width:560px){.topnav{top:max(16px,env(safe-area-inset-top));gap:0;padding:6px 8px}.topnav a{padding:8px 10px;font-size:13px}.topnav .long{display:none}}
@media (max-width:380px){.topnav{padding:5px 6px}.topnav a{padding:8px 7px;font-size:12.5px}}

</style>
</head>
<body>
<h1 class="sr-only">Lennon Helman, software developer, Greencastle, PA.</h1>

<div id="intro" aria-hidden="true">
  <div class="sky"></div>
  <canvas class="clouds far"></canvas>
  <canvas class="clouds near"></canvas>
  <canvas class="wordmark"></canvas>
  <div class="fog"></div>
</div>

<section id="work" aria-label="Project gallery">
  <div class="stage">
    <h2 class="work-title">Project Gallery</h2>
    <canvas id="mac" aria-hidden="true"></canvas>
    <p class="mac-hint" aria-hidden="true">Keep scrolling</p>
    <a class="board-cta" href="mailto:lenodrips@gmail.com?subject=New%20project" tabindex="-1">Start a project ↗</a>
  </div>
  <div class="fly" aria-hidden="true"></div>
  <div class="zoom" aria-hidden="true"></div>
  <div class="walk" aria-hidden="true"></div>
  <div class="tour" aria-hidden="true"></div>
</section>

<nav class="topnav" aria-label="Site">
  <a href="#home" data-go="home">home</a>
  <a href="#gallery" data-go="gallery"><span class="long">project </span>gallery</a>
  <a href="#services" data-go="services">services</a>
  <a href="#developer" data-go="developer">developer</a>
  <a href="#reviews" data-go="reviews">reviews</a>
</nav>
<script type="module" src="mac/mac.min.js?v=12"></script>

<script>
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const clamp01 = x => Math.min(1, Math.max(0, x));
  const smooth = (a, b, x) => { const t = clamp01((x - a) / (b - a)); return t * t * (3 - 2 * t); };
  // write a style only when it changes, so idle frames cost nothing
  const styled = new WeakMap();
  function set(el, prop, value) {
    let m = styled.get(el);
    if (!m) styled.set(el, (m = {}));
    if (m[prop] !== value) { m[prop] = value; el.style[prop] = value; }
  }

  /* ---------- scroll positions ---------- */
  // the stage is pinned from the top; the fly-through from the sky takes the first stretch of scrolling and ends
  // on the laptop (closeAt); scrolling on from there to the end of the page (officeAt) takes the camera to the
  // chalkboard in the office next door
  const work = document.getElementById("work");
  const stage = work.querySelector(".stage");
  const zoomEl = work.querySelector(".zoom"), walkEl = work.querySelector(".walk"), tourEl = work.querySelector(".tour");
  let closeAt = 1, officeAt = 2, kitchenAt = 3, reviewsAt = 4;
  function measure() {
    closeAt = Math.max(1, work.offsetTop + zoomEl.offsetTop - stage.offsetHeight);
    officeAt = closeAt + zoomEl.offsetHeight;
    kitchenAt = officeAt + walkEl.offsetHeight;
    reviewsAt = Math.max(kitchenAt + 1, Math.min(kitchenAt + tourEl.offsetHeight, maxScroll()));
  }
  const maxScroll = () => document.documentElement.scrollHeight - innerHeight;
  measure();
  if ("scrollRestoration" in history) history.scrollRestoration = "manual";   // always start in the sky
  const easeInOut = t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  // scroll the page to a position over a set time, eased; `at` = [fraction, fn] runs fn once partway
  function scrollAnim(to, dur, at) {
    const from = window.scrollY;
    if (dur === undefined) dur = Math.min(1.4, Math.max(0.5, (Math.abs(to - from) / innerHeight) * 0.5));
    if (reduce || Math.abs(to - from) < 1) { window.scrollTo(0, to); if (at) at[1](); return Promise.resolve(); }
    const t0 = performance.now();
    return new Promise(done => (function frame(now) {
      const t = clamp01((now - t0) / (dur * 1000));
      window.scrollTo(0, from + (to - from) * easeInOut(t));
      if (at && t >= at[0]) { at[1](); at = null; }
      if (t < 1) requestAnimationFrame(frame); else done();
    })(t0));
  }

  /* ---------- the moves between stops ---------- */
  // While one runs, the page ignores scrolling. A new one doesn't start until it's done.
  let auto = false;
  async function run(fn) {
    if (auto) return;
    auto = true;
    try { await fn(); } finally { auto = false; kick(); }
  }
  /* ---------- scroll gestures ---------- */
  // In the sky, one scroll flies all the way down to the laptop (and one scroll up at the laptop flies back up).
  // At the laptop, one scroll down flies on to the chalkboard in the house next door, and one scroll up from the
  // board flies back to the laptop. Only a scroll that starts at a stop does it: one that arrives from elsewhere (the
  // tail of the last flight) stops there first.
  let gStartY = 0;
  const startedAt = y => Math.abs(gStartY - y) <= 1;
  function decide(dir) {
    if (auto) return { run: null };                 // something's moving: hold still
    const y = window.scrollY;
    if (dir > 0 && y < closeAt - 1) return { run: () => run(() => scrollAnim(closeAt, reduce ? 0 : 3.2)) };
    if (dir < 0 && y > 1 && y <= closeAt + 1) return { run: startedAt(closeAt) || y < closeAt - 1 ? () => run(() => scrollAnim(0, reduce ? 0 : 2.4)) : null };
    if (dir > 0 && y < officeAt - 1) return { run: startedAt(closeAt) || y > closeAt + 1 ? () => run(() => scrollAnim(officeAt, reduce ? 0 : 4.2)) : null };
    if (dir < 0 && y <= officeAt + 1) return { run: startedAt(officeAt) || y < officeAt - 1 ? () => run(() => scrollAnim(closeAt, reduce ? 0 : 3.6)) : null };
    if (dir > 0 && y < kitchenAt - 1) return { run: startedAt(officeAt) || y > officeAt + 1 ? () => run(() => scrollAnim(kitchenAt, reduce ? 0 : 3.4)) : null };
    if (dir < 0 && y <= kitchenAt + 1) return { run: startedAt(kitchenAt) || y < kitchenAt - 1 ? () => run(() => scrollAnim(officeAt, reduce ? 0 : 3.2)) : null };
    if (dir > 0 && y < reviewsAt - 1) return { run: startedAt(kitchenAt) || y > kitchenAt + 1 ? () => run(() => scrollAnim(reviewsAt, reduce ? 0 : 6)) : null };
    if (dir < 0 && y <= reviewsAt + 1) return { run: startedAt(reviewsAt) || y < reviewsAt - 1 ? () => run(() => scrollAnim(kitchenAt, reduce ? 0 : 5.4)) : null };
    return null;
  }
  // a wheel or trackpad gesture is a run of events without a pause; a sudden jump in strength starts a new one,
  // so a fresh swipe isn't mistaken for the momentum of the last
  let lastWheel = -1e9, lastMag = 0;
  addEventListener("wheel", e => {
    const ts = e.timeStamp || performance.now(), mag = Math.abs(e.deltaY);
    if (ts - lastWheel > 200 || (mag > lastMag * 1.8 && mag > 15)) gStartY = window.scrollY;
    lastWheel = ts; lastMag = mag;
    const d = e.deltaY ? decide(Math.sign(e.deltaY)) : null;
    if (!d) return;
    e.preventDefault();
    if (d.run) d.run();
  }, { passive: false });
  let touchY = null;
  addEventListener("touchstart", e => { touchY = e.touches[0].clientY; gStartY = window.scrollY; }, { passive: true });
  addEventListener("touchmove", e => {
    if (touchY === null) return;
    const dy = touchY - e.touches[0].clientY;            // positive: finger moving up, page scrolling down
    const d = dy ? decide(Math.sign(dy)) : null;
    if (!d) return;
    if (e.cancelable) e.preventDefault();                 // from the first move, or the browser takes over the scroll
    if (d.run && Math.abs(dy) > 8) { d.run(); touchY = null; }
  }, { passive: false });
  addEventListener("touchend", () => { touchY = null; }, { passive: true });
  addEventListener("keydown", e => {
    if (e.defaultPrevented || e.altKey || e.ctrlKey || e.metaKey) return;
    const a = document.activeElement;
    const down = ["ArrowDown", "PageDown", "End"].includes(e.key) || (e.key === " " && !e.shiftKey && !(a && a.closest && a.closest("button, a")));
    const up = ["ArrowUp", "PageUp", "Home"].includes(e.key) || (e.key === " " && e.shiftKey);
    if (!down && !up) return;
    gStartY = window.scrollY;
    const d = decide(down ? 1 : -1);
    if (!d) return;
    e.preventDefault();
    if (d.run) d.run();
  });

  /* ---------- navigation ---------- */
  const nav = document.querySelector(".topnav");
  const navLinks = [...nav.querySelectorAll("a[data-go]")];
  nav.addEventListener("click", e => {
    const a = e.target.closest("a[data-go]");
    if (!a) return;
    e.preventDefault();
    goTo(a.dataset.go);
  });
  // go there, flying into or out of the screen on the way
  function goTo(where) {
    const stops = [0, closeAt, officeAt, kitchenAt, reviewsAt], to = { home: 0, gallery: 1, services: 2, developer: 3, reviews: 4 }[where];
    let from = 0;
    stops.forEach((s, i) => { if (Math.abs(window.scrollY - s) < Math.abs(window.scrollY - stops[from])) from = i; });
    run(() => scrollAnim(stops[to], reduce ? 0 : Math.min(7, 1.4 + 1.6 * Math.abs(to - from) + (Math.max(to, from) === 4 ? 2.4 : 0))));
  }
  let current = "";
  function markCurrent(where) {
    if (where === current) return;
    current = where;
    navLinks.forEach(a => a.setAttribute("aria-current", a.dataset.go === where));
  }

  /* ---------- the sky: clouds and the wordmark, flown through on the way down ---------- */
  const intro = document.getElementById("intro");
  const skyEl = intro.querySelector(".sky"), fogEl = intro.querySelector(".fog");
  const farEl = intro.querySelector(".clouds.far"), nearEl = intro.querySelector(".clouds.near");
  const wordEl = intro.querySelector(".wordmark"), wctx = wordEl.getContext("2d");
  let iw = 1, ih = 1, idpr = 1, word = null;

  // soft cumulus clouds: puffs of white over a greyer, flatter underside, seeded so they're the same each visit
  function drawClouds(cv, seed, n, minW, maxW, bands, alpha) {
    const r = (() => { let s = seed; return () => ((s = (s * 16807) % 2147483647) - 1) / 2147483646; })();
    const pad = iw * 0.2;                            // the canvas runs this far past each side of the screen
    cv.width = Math.round((iw + pad * 2) * idpr); cv.height = Math.round(ih * idpr);
    const x = cv.getContext("2d");
    x.setTransform(idpr, 0, 0, idpr, pad * idpr, 0);
    for (let i = 0; i < n; i++) {
      const [y0, y1] = bands[i % bands.length];
      const w = (minW + r() * (maxW - minW)) * Math.max(iw, ih * 0.8), cx = (r() * 1.4 - 0.2) * iw, cy = (y0 + r() * (y1 - y0)) * ih, h = w * 0.32;
      const puff = (px, py, pr, col) => {
        const g = x.createRadialGradient(px, py, 0, px, py, pr);
        g.addColorStop(0, col); g.addColorStop(1, "rgba(255,255,255,0)");
        x.fillStyle = g; x.beginPath(); x.arc(px, py, pr, 0, Math.PI * 2); x.fill();
      };
      for (let k = 0; k < 26; k++)        // the shaded underside
        puff(cx + (r() - 0.5) * w, cy + r() * h * 0.25, w * (0.1 + r() * 0.12), `rgba(176,196,222,${0.32 * alpha})`);
      for (let k = 0; k < 40; k++)        // the sunlit tops, heaped higher in the middle
        { const u = r() - 0.5; puff(cx + u * w, cy - Math.abs(r() * r()) * h * (1 - Math.abs(u) * 1.4), w * (0.08 + r() * 0.14), `rgba(255,255,255,${0.75 * alpha})`); }
    }
  }
  // LENNON HELMAN, with SOFTWARE ENGINEER · GREENCASTLE, PA under it: drawn by hand, so the O's middle is known exactly and the
  // camera can fly into it at any scale with the letters staying sharp
  function layoutWord() {
    const two = iw / ih < 1.05;                       // upright screens: the name on two lines
    const lines = two ? ["LENNON", "HELMAN"] : ["LENNON HELMAN"];
    wctx.font = '900 100px "League Spartan", system-ui, sans-serif';
    const track = -0.04 * 100;
    const widthOf = t => [...t].reduce((a, c) => a + wctx.measureText(c).width + track, -track);
    const fs = Math.min((iw * (two ? 0.84 : 0.86)) / Math.max(...lines.map(widthOf)) * 100, ih * (two ? 0.22 : 0.3));
    const k = fs / 100, lh = fs * 0.86, sub = Math.max(18, fs * (two ? 0.2 : 0.19));
    const subs = two ? ["SOFTWARE ENGINEER", "GREENCASTLE, PA"] : ["SOFTWARE ENGINEER  ·  GREENCASTLE, PA"];
    const blockH = lh * lines.length + sub * (1.1 + 1.25 * subs.length);
    const top = ih * 0.5 - blockH / 2 + fs * 0.72;
    const out = { fs, sub, subs, lines: [], two, ox: 0, oy: 0, subY: top + lh * (lines.length - 1) + sub * 2.1 };
    lines.forEach((t, li) => {
      const w = widthOf(t) * k, x0 = (iw - w) / 2, by = top + li * lh, chars = [];
      let x = x0;
      for (const c of t) { chars.push([c, x]); x += (wctx.measureText(c).width + track) * k; }
      out.lines.push({ by, chars });
    });
    // the centre of the O in LENNON, from the glyph's ink box
    const [oc, ox] = out.lines[0].chars.find(([c]) => c === "O");
    const m = wctx.measureText("O");
    out.ox = ox + ((m.actualBoundingBoxRight - m.actualBoundingBoxLeft) / 2) * k;
    out.oy = out.lines[0].by + ((m.actualBoundingBoxDescent - m.actualBoundingBoxAscent) / 2) * k;
    word = out;
  }
  // t: seconds since the letters started rising in. Each letter rises into place in turn, then they all bob gently,
  // each a little out of step, like they're floating in the sky; the line underneath fades up after them
  let wordT0 = 0;
  function drawWord(scale, t) {
    const w = word, c = wctx;
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.clearRect(0, 0, wordEl.width, wordEl.height);
    c.setTransform(idpr * scale, 0, 0, idpr * scale, idpr * w.ox * (1 - scale), idpr * w.oy * (1 - scale));
    c.fillStyle = "#0a0a0a";                          // solid black, so it reads on both the sky and the clouds
    c.shadowColor = "transparent";
    c.font = `900 ${w.fs}px "League Spartan", system-ui, sans-serif`;
    let i = 0;
    for (const l of w.lines) for (const [ch, x] of l.chars) {
      const rise = reduce ? 1 : clamp01((t - i * 0.06) / 0.7), e = 1 - Math.pow(1 - rise, 3);
      const bob = reduce ? 0 : Math.sin(t * 1.6 - i * 0.55) * w.fs * 0.018 * smooth(0.6, 1.4, t - i * 0.06);
      c.globalAlpha = e;
      c.fillText(ch, x, l.by + (1 - e) * w.fs * 0.5 + bob);
      i++;
    }
    c.globalAlpha = reduce ? 1 : smooth(0.6, 1.4, t - i * 0.06 + 0.6);
    c.font = `900 ${w.sub}px "League Spartan", system-ui, sans-serif`;
    c.textAlign = "center";
    if ("letterSpacing" in c) c.letterSpacing = `${w.sub * 0.2}px`;
    w.subs.forEach((txt, k) => c.fillText(txt, iw / 2 + w.sub * 0.1, w.subY + k * w.sub * 1.3));
    if ("letterSpacing" in c) c.letterSpacing = "0px";
    c.textAlign = "left";
    c.globalAlpha = 1;
  }
  function sizeIntro() {
    iw = innerWidth; ih = innerHeight;
    idpr = Math.min(2, devicePixelRatio || 1);
    wordEl.width = Math.round(iw * idpr); wordEl.height = Math.round(ih * idpr);
    const cdpr = idpr; idpr = Math.min(1.5, idpr);         // clouds are soft: they don't need full resolution
    // above and below the name, so it reads on open blue sky
    drawClouds(farEl, 7, 10, 0.2, 0.38, [[0.04, 0.24], [0.74, 0.98]], 0.9);
    drawClouds(nearEl, 31, 6, 0.4, 0.7, [[-0.05, 0.12], [0.86, 1.08]], 0.85);
    idpr = cdpr;
    layoutWord();
    lastP = -1;
  }
  let lastP = -1, introOn = true;
  // p: 0 at the top of the page, 1 on the laptop
  // the name and clouds keep moving while they can be seen, so this also runs when the scroll hasn't changed
  function flyIntro(p, now) {
    const live = p < 0.34 && !reduce && word;
    if (p === lastP && !live) return;
    lastP = p;
    const on = p < 1;
    if (on !== introOn) { introOn = on; intro.style.visibility = on ? "visible" : "hidden"; }
    if (!on || !word) return;
    // 0–0.34: into the O. The scale grows exponentially, so the flight feels even; by the end the O's middle is
    // wider than the screen and the letters are gone past its edges
    const a = clamp01(p / 0.34);
    const scale = Math.exp(Math.log(70) * Math.pow(a, 1.6));
    if (!wordT0) wordT0 = now;
    drawWord(scale, (now - wordT0) / 1000);
    set(wordEl, "opacity", a >= 1 ? "0" : "1");
    // the clouds behind come closer more slowly, then the camera passes through them (0.3–0.62)
    const b = smooth(0.28, 0.62, p);
    const drift = reduce ? 0 : now / 1000;           // the clouds drift slowly across the sky
    set(farEl, "transform", `translate3d(${(Math.sin(drift * 0.05) * 3).toFixed(2)}vw,0,0) scale(${(1 + 0.5 * a + 3 * b * b).toFixed(4)})`);
    set(farEl, "opacity", (1 - smooth(0.4, 0.5, p)).toFixed(3));
    set(nearEl, "transform", `translate3d(${(Math.sin(drift * 0.07 + 1) * 5).toFixed(2)}vw,0,0) scale(${(1 + 0.9 * a + 5 * b * b).toFixed(4)})`);
    set(nearEl, "opacity", (1 - smooth(0.36, 0.48, p)).toFixed(3));
    set(fogEl, "opacity", (smooth(0.3, 0.4, p) * (1 - smooth(0.43, 0.53, p))).toFixed(3));
    // inside the cloud the sky gives way to the lawn far below
    set(skyEl, "opacity", (1 - smooth(0.4, 0.46, p)).toFixed(3));
  }
  addEventListener("resize", () => { sizeIntro(); kick(); });
  sizeIntro();
  (document.fonts ? document.fonts.load('900 100px "League Spartan"').then(() => document.fonts.ready) : Promise.resolve())
    .then(() => { sizeIntro(); wordT0 = 0; kick(); });   // the letters rise in once the font is ready

  /* ---------- the MacBook page ---------- */
  const title = work.querySelector(".work-title");
  const macHint = work.querySelector(".mac-hint");
  const boardCta = work.querySelector(".board-cta");

  /* ---------- one animation loop: it runs while something moves or the gallery plays, and sleeps otherwise ---------- */
  let running = false, last = 0;
  function kick() { if (!running) { running = true; last = performance.now(); requestAnimationFrame(loop); } }
  addEventListener("scroll", kick, { passive: true });
  addEventListener("mac-ready", kick);
  // without WebGL the MacBook can't draw: the services get a plain background instead
  addEventListener("load", () => { if (!window.Mac) document.body.classList.add("no-mac"); measure(); kick(); });

  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    const y = window.scrollY;
    const c = clamp01((y - closeAt) / (officeAt - closeAt));     // 0 on the laptop, 1 at the whiteboard
    const k = clamp01((y - officeAt) / (kitchenAt - officeAt));  // 0 at the whiteboard, 1 at the kitchen's menu
    const l = clamp01((y - kitchenAt) / (reviewsAt - kitchenAt)); // 0 at the menu, 1 at the reviews in the living room
    const p = clamp01(y / closeAt);                 // 0 in the sky, 1 on the laptop
    flyIntro(p, now);
    // the headline lifts away as the camera sets off
    set(title, "transform", `translate3d(0, ${(-smooth(0, 0.15, c) * 40).toFixed(2)}px, 0)`);
    set(title, "opacity", (smooth(0.86, 1, p) * (1 - smooth(0, 0.12, c))).toFixed(3));
    set(macHint, "opacity", p === 1 && c === 0 && !auto ? "1" : "0");
    const atBoard = c >= 0.999;
    if (atBoard !== boardCta.classList.contains("on")) { boardCta.classList.toggle("on", atBoard); boardCta.tabIndex = atBoard ? 0 : -1; }
    // the 3D camera: from high above the lawn, once the clouds open (0.42), down to the laptop, then on to the office
    const down = clamp01((p - 0.4) / 0.6);
    if (window.Mac && p > 0.38) Mac.update(down, c, k, l, now, dt);

    markCurrent(l >= 0.5 ? "reviews" : k >= 0.5 ? "developer" : c >= 0.5 ? "services" : p >= 1 ? "gallery" : "home");

    // keep going while something moves: the grass and the gallery on the laptop's screen, or the sky
    const playing = (window.Mac && p > 0.38 && c < 1 && !reduce) || (p < 0.34 && !reduce)   // the gallery, or the sky
      || (window.Mac && p > 0.38 && Mac.busy());                                             // or the board being written
    if (playing) requestAnimationFrame(loop);
    else running = false;
  }

  addEventListener("resize", () => { measure(); kick(); });
  kick();
</script>
</body>
</html>
