<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>Lennon Helman</title>
<meta name="description" content="Lennon Helman, software developer in Greencastle, PA. Dev reel 2026.">
<style>
html,body{margin:0;background:#0a0a0a}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* the page scrolls through one screen of distance; both layers stay pinned to the viewport */
#track{height:200vh;height:200svh}

/* 1. the showreel covers the whole screen; its 1920x1080 frame is scaled to cover and centered */
#reel{position:fixed;inset:0;overflow:hidden;background:#0a0a0a}
#reel iframe{position:absolute;left:0;top:0;width:1920px;height:1080px;border:0;transform-origin:0 0;pointer-events:none}
#hint{position:absolute;left:50%;bottom:18px;width:2px;height:34px;margin-left:-1px;background:linear-gradient(#f5f3ee,rgba(245,243,238,0));animation:hint 1.6s ease-in-out infinite}
@keyframes hint{0%{transform:translateY(-10px);opacity:0}40%{opacity:1}100%{transform:translateY(10px);opacity:0}}

/* 2. scrolling down slides a white screen up over the reel, and the laptop springs up from the bottom with it */
#work{position:fixed;inset:0;background:#f5f9fc;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;transform:translateY(100%);transform-origin:50% 0;border-radius:56px;box-shadow:0 -30px 80px rgba(0,0,0,.45);will-change:transform,border-radius}
.laptop{position:relative;width:min(1180px,96vw,calc(133vh));aspect-ratio:1448/1086;transform:translateY(100vh);will-change:transform}
.laptop>img{position:absolute;inset:0;width:100%;height:100%;display:block;
  /* the hand runs off the photo's left edge; fade that edge into the page */
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 14%,#000 92%,transparent 100%),linear-gradient(180deg,transparent 0,#000 7%);
  -webkit-mask-composite:source-in;mask-image:linear-gradient(90deg,transparent 0,#000 14%,#000 92%,transparent 100%),linear-gradient(180deg,transparent 0,#000 7%);mask-composite:intersect}
/* phones: centre the laptop and let the photo's empty margins run off the sides */
@media (max-width:700px){#work{align-items:center}.laptop{width:118vw;flex:none}}

/* the laptop's screen, positioned over the photo's display (257,99)-(1191,685) of 1448x1086 */
.screen{position:absolute;left:17.749%;top:9.116%;width:64.503%;height:53.959%;border-radius:1.1% / 1.6%;overflow:hidden;background:#151515;container-type:size;color:#f2f2f2}
.screen-bg{position:absolute;inset:-4%;background:url("laptop/shot-4.jpg") center 30%/cover;filter:blur(6px) brightness(.32) saturate(.7)}
.notch{position:absolute;left:44.86%;top:0;width:10.92%;height:3.2%;background:#040404;border-radius:0 0 1.2cqw 1.2cqw;z-index:3}
.bar{position:absolute;left:0;right:0;top:6.5%;display:flex;font-size:1.45cqw;line-height:1.2;letter-spacing:-.01em;z-index:2}
.bar span{position:absolute;white-space:nowrap}
.foot{position:absolute;left:0;right:0;bottom:4.2%;text-align:center;font-size:1.3cqw;opacity:.9;z-index:2}
.ribbon{position:absolute;inset:0;z-index:1}
.card{position:absolute;top:0;height:100%;will-change:clip-path,transform}
.card img{position:absolute;left:0;width:100%;object-fit:cover;display:block}

@media (prefers-reduced-motion: reduce){
  #hint{animation:none}
}
</style>
</head>
<body>
<h1 class="sr-only">Lennon Helman, software developer, Greencastle, PA. Dev reel 2026: build it, ship it.</h1>

<div id="track"></div>

<div id="reel" aria-hidden="true">
  <iframe src="reel/index.html?v=5" title="Showreel" tabindex="-1"></iframe>
  <div id="hint"></div>
</div>

<section id="work" aria-label="Work">
  <h2 class="sr-only">Work</h2>
  <div class="laptop" aria-hidden="true">
    <img src="laptop/laptop.jpg" alt="" width="1448" height="1086">
    <div class="screen">
      <div class="screen-bg"></div>
      <div class="notch"></div>
      <div class="bar">
        <span style="left:2%">Lennon Helman</span>
        <span style="left:18%">Software Developer<br>based in Greencastle, PA</span>
        <span style="left:57%">Index&nbsp;&nbsp;Info&nbsp;&nbsp;Archive</span>
        <span style="right:2%">Email</span>
      </div>
      <div class="ribbon" id="ribbon"></div>
      <div class="foot">© 2026 Lennon Helman</div>
    </div>
  </div>
</section>

<script>
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------- showreel ---------- */
  const reelBox = document.getElementById("reel");
  const frame = reelBox.querySelector("iframe");
  let reel = null;
  // cover the screen on landscape displays; on portrait phones covering would crop away most of the frame, so fit the width
  function fit() {
    const w = reelBox.clientWidth, h = reelBox.clientHeight;
    const s = w >= h ? Math.max(w / 1920, h / 1080) : w / 1920;
    frame.style.transform = `translate(${(w - 1920 * s) / 2}px, ${(h - 1080 * s) / 2}px) scale(${s})`;
  }
  fit();
  addEventListener("resize", fit);
  // the composition registers a paused GSAP timeline; loop it, or show the end card for reduced motion
  frame.addEventListener("load", function find(tries = 50) {
    const tl = frame.contentWindow && frame.contentWindow.__timelines && frame.contentWindow.__timelines.reel;
    if (!tl) return tries > 0 && setTimeout(() => find(tries - 1), 100);
    if (reduce) return tl.progress(1);
    tl.eventCallback("onComplete", () => tl.play(0));
    tl.play(0);
    reel = tl;
  });

  /* ---------- scrolling raises the white screen, and the laptop springs up from the bottom ---------- */
  const work = document.getElementById("work");
  const laptop = work.querySelector(".laptop");
  const hint = document.getElementById("hint");
  let lapY = innerHeight, lapV = 0, shown = 0;
  const progress = () => Math.min(1, Math.max(0, scrollY / innerHeight));
  const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

  /* ---------- pictures flow along a waving ribbon on the laptop screen ---------- */
  const screen = document.querySelector(".screen");
  const ribbon = document.getElementById("ribbon");
  // relative widths of the seven pictures, as laid out in the original screen
  const SHOTS = [90, 117, 121, 188, 154, 126, 98];
  const GAP = 6, TOTAL = SHOTS.reduce((a, w) => a + w + GAP, 0); // in 934-wide screen units
  const cards = [];
  for (let copy = 0; copy < 3; copy++) {
    SHOTS.forEach((w, i) => {
      const el = document.createElement("div");
      el.className = "card";
      const img = document.createElement("img");
      img.src = `laptop/shot-${i + 1}.jpg`;
      img.alt = "";
      el.appendChild(img);
      ribbon.appendChild(el);
      cards.push({ el, img, w, start: copy * TOTAL + SHOTS.slice(0, i).reduce((a, v) => a + v + GAP, 0) });
    });
  }

  // ribbon shape at screen position u (0..1) and time t: a centre line that ripples, and a height that swells in the middle
  const centre = (u, t) => 0.57 + 0.028 * Math.sin(2 * Math.PI * (u * 1.1 - t * 0.12)) + 0.012 * Math.sin(2 * Math.PI * (u * 2.3 + t * 0.21));
  const half = (u, t) => 0.112 + 0.108 * Math.sin(Math.PI * Math.min(1, Math.max(0, u))) * (1 + 0.06 * Math.sin(t * 0.9 + u * 4));

  let offset = 0, boost = 0, lastY = scrollY, dir = 0, settle;
  addEventListener("scroll", () => {
    const dy = scrollY - lastY;
    boost += dy * 0.6;
    if (dy) dir = Math.sign(dy);
    lastY = scrollY;
    // once scrolling stops part-way, finish the move in the direction it was going
    clearTimeout(settle);
    settle = setTimeout(() => {
      const end = document.documentElement.scrollHeight - innerHeight;
      if (scrollY > 2 && scrollY < end - 2) scrollTo({ top: dir > 0 ? end : 0, behavior: reduce ? "auto" : "smooth" });
    }, 140);
  }, { passive: true });

  function drawRibbon(t, dt) {
    if (!reduce) {
      boost *= 0.9;                            // scrolling nudges the strip, then it settles
      offset = (offset + dt * 38 + boost * dt * 10) % TOTAL;
      if (offset < 0) offset += TOTAL;
    }
    const W = screen.clientWidth, H = screen.clientHeight, k = W / 934;
    for (const c of cards) {
      let x0 = c.start - offset;
      if (x0 < -TOTAL) x0 += 3 * TOTAL;       // keep the three copies tiled across the screen
      if (x0 > 2 * TOTAL) x0 -= 3 * TOTAL;
      const x1 = x0 + c.w;
      if (x1 < -10 || x0 > 944) { c.el.style.visibility = "hidden"; continue; }
      c.el.style.visibility = "visible";
      const u0 = x0 / 934, u1 = x1 / 934;
      const t0 = (centre(u0, t) - half(u0, t)) * H, b0 = (centre(u0, t) + half(u0, t)) * H;
      const t1 = (centre(u1, t) - half(u1, t)) * H, b1 = (centre(u1, t) + half(u1, t)) * H;
      const top = Math.min(t0, t1), bottom = Math.max(b0, b1);
      c.el.style.left = x0 * k + "px";
      c.el.style.width = c.w * k + "px";
      c.el.style.clipPath = `polygon(0 ${t0}px, 100% ${t1}px, 100% ${b1}px, 0 ${b0}px)`;
      c.img.style.top = top + "px";
      c.img.style.height = bottom - top + "px";
    }
  }

  let last = performance.now();
  function frameLoop(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    const p = progress();

    // the white card eases after the scroll instead of jumping with it
    shown = reduce ? p : shown + (p - shown) * (1 - Math.exp(-dt * 9));
    if (Math.abs(p - shown) < 0.0005) shown = p;
    // it rises as a rounded card, a little smaller than the screen, and grows to fill it as its corners straighten
    const e = smooth(0, 1, shown), grow = smooth(0.55, 1, shown);
    work.style.transform = `translate3d(0, ${(1 - e) * 100}%, 0) scale(${0.9 + 0.1 * grow})`;
    work.style.borderRadius = `${56 * (1 - grow)}px`;
    // the laptop waits until the card is mostly up, then glides in from below on a soft spring
    const target = (1 - smooth(0.35, 0.95, shown)) * innerHeight;
    if (reduce) lapY = target;
    else {
      lapV += (110 * (target - lapY) - 19 * lapV) * dt;  // nearly critically damped: a hint of settle, no bounce
      lapY += lapV * dt;
    }
    laptop.style.transform = `translate3d(0, ${lapY}px, 0)`;
    hint.style.opacity = Math.max(0, 1 - p * 5);

    if (shown > 0) drawRibbon(now / 1000, dt);
    if (reel) (shown >= 1 ? reel.pause() : reel.paused() && reel.play());
    requestAnimationFrame(frameLoop);
  }
  drawRibbon(0, 0);
  requestAnimationFrame(frameLoop);
</script>
</body>
</html>
