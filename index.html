<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>Lennon Helman</title>
<meta name="description" content="Lennon Helman, Greencastle, PA. Showreel 2026.">
<style>
html,body{margin:0;height:100%;background:#0a0a0a;overflow:hidden}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* the showreel fills the screen; its 1920x1080 frame is scaled to fit and centered */
#reel{position:fixed;inset:0;overflow:hidden;background:#0a0a0a}
#reel iframe{position:absolute;left:0;top:0;width:1920px;height:1080px;border:0;transform-origin:0 0;pointer-events:none}
</style>
</head>
<body>
<h1 class="sr-only">Lennon Helman, Greencastle, PA. Showreel 2026.</h1>
<div id="reel" aria-hidden="true"><iframe src="reel/index.html?v=2" title="Showreel" tabindex="-1"></iframe></div>
<script>
  const box = document.getElementById("reel");
  const frame = box.querySelector("iframe");

  function fit() {
    const s = Math.min(box.clientWidth / 1920, box.clientHeight / 1080);
    frame.style.transform = `translate(${(box.clientWidth - 1920 * s) / 2}px, ${(box.clientHeight - 1080 * s) / 2}px) scale(${s})`;
  }
  fit();
  addEventListener("resize", fit);

  // the composition registers a paused GSAP timeline; loop it, or show the end card for reduced motion
  frame.addEventListener("load", function find(tries = 50) {
    const tl = frame.contentWindow && frame.contentWindow.__timelines && frame.contentWindow.__timelines.reel;
    if (!tl) return tries > 0 && setTimeout(() => find(tries - 1), 100);
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return tl.progress(1);
    tl.eventCallback("onComplete", () => tl.play(0));
    tl.play(0);
  });
</script>
</body>
</html>
